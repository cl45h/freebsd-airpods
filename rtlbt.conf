# Auto-load Realtek RTL8761BU BT firmware on USB attach
# Install to: /usr/local/etc/devd/rtlbt.conf
# Then: service devd restart

notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "ATTACH";
    match "vendor"      "0x0bda";
    match "product"     "0x8771";
    action "sleep 2 && /usr/sbin/rtlbtfw -d $cdev";
};
